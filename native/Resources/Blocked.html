<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Get back to work!</title>
  <style>
    @font-face { font-family: Archivo; src: url("Archivo-Regular.ttf"); font-weight: 400; }
    @font-face { font-family: Archivo; src: url("Archivo-SemiBold.ttf"); font-weight: 600; }
    :root { color-scheme: dark; font-family: Archivo, -apple-system, sans-serif; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      color: #f7f7f7;
      background: #09090a;
    }
    main { width: min(620px, calc(100vw - 48px)); }
    .eyebrow { margin: 0 0 18px; color: #ff4422; font-size: 16px; font-weight: 600; }
    h1 { margin: 0; max-width: 560px; font-size: clamp(48px, 8vw, 84px); line-height: .94; letter-spacing: -.045em; }
    p { margin: 28px 0 0; max-width: 520px; color: #99999f; font-size: 20px; line-height: 1.45; }
    strong { color: #f7f7f7; font-weight: 600; }
    .bar { height: 14px; margin-top: 44px; overflow: hidden; border-radius: 999px; background: #efefef; }
    .bar::before { content: ""; display: block; width: 50%; height: 100%; background: #ff4422; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow" id="site">consume is paused</p>
    <h1>Get back to work!</h1>
    <p>Create for about <strong id="minutes">a few minutes</strong> to bring today’s balance back under your target. This page will be available again automatically.</p>
    <div class="bar" aria-hidden="true"></div>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const name = params.get('name');
    const minutes = Number(params.get('minutes'));
    if (name) document.querySelector('#site').textContent = `${name} is paused`;
    if (minutes > 0) document.querySelector('#minutes').textContent = `${minutes} ${minutes === 1 ? 'minute' : 'minutes'}`;
  </script>
</body>
</html>
